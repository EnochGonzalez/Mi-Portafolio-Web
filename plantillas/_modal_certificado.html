  <dialog class="cert-modal" id="cert-modal" aria-labelledby="cert-modal-title">

      <header class="cert-modal__header">
        <h2 class="cert-modal__title" id="cert-modal-title">Certificado</h2>
        <button type="button" class="cert-modal__close" aria-label="Cerrar certificado">×</button>
      </header>
      <div class="cert-modal__body">
        <img class="cert-modal__img" id="cert-modal-img" alt="">

      <footer class="cert-modal__footer">

      </footer>
    </div>
  </dialog>
